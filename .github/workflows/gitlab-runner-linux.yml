name: GitLab Runner Veo Linux

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable GitLab commit hash used to version the pnpm store
        required: true
        type: string
      cache_enabled:
        description: Whether this GitLab job installs pnpm dependencies
        required: true
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: gitlab-veo-linux-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GITLAB_RUNNER_TOKEN: ${{ secrets.GITLAB_RUNNER_TOKEN_LINUX }}
      PNPM_CACHE_DIR: ${{ github.workspace }}/.cache/veo3studio-pnpm-store
      PNPM_CACHE_KEY: pnpm-store-veo3studio-linux-v12-${{ inputs.cache_key }}
      RUNNER_LOG: /tmp/gitlab-runner-private.log

    steps:
      - name: Restore pnpm package store
        if: ${{ inputs.cache_enabled == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_CACHE_DIR }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            pnpm-store-veo3studio-linux-v12-

      - name: Validate runner configuration
        run: |
          set -euo pipefail
          test -n "${GITLAB_URL:-}"
          test -n "${GITLAB_RUNNER_TOKEN:-}"
          test -n "${PNPM_CACHE_DIR:-}"
          test "$(uname -m)" = "x86_64"
          docker version
          mkdir -p "$PNPM_CACHE_DIR"

      - name: Install GitLab Runner
        run: |
          set -euo pipefail
          runner_url="https://gitlab-runner-downloads.s3.amazonaws.com/v19.5.2/binaries/gitlab-runner-linux-amd64"
          runner_sha256="1c1752101f5b0f212615ad2c674d8f3499de96d9377f31aed1e3eecdbd068de1"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            "$runner_url" \
            -o /tmp/gitlab-runner
          printf '%s  %s\n' "$runner_sha256" /tmp/gitlab-runner | sha256sum -c -
          sudo install -m 0755 /tmp/gitlab-runner /usr/local/bin/gitlab-runner
          gitlab-runner --version

      - name: Run exactly one isolated GitLab job
        run: |
          set -euo pipefail
          runner_name="gh-veo-linux-${GITHUB_RUN_ID}"
          umask 077
          set +e
          gitlab-runner run-single \
            --url "$GITLAB_URL" \
            --token "$GITLAB_RUNNER_TOKEN" \
            --name "$runner_name" \
            --executor docker \
            --docker-image alpine:3.20 \
            --docker-volumes "$PNPM_CACHE_DIR:/cache" \
            --max-builds 1 \
            --wait-timeout 600 \
            >"$RUNNER_LOG" 2>&1
          runner_status=$?
          set -e
          rm -f "$RUNNER_LOG"
          if [ "$runner_status" -ne 0 ]; then
            echo "GitLab runner exited with status $runner_status; inspect the GitLab job trace."
            exit "$runner_status"
          fi
          echo "GitLab runner finished its one-job session."

      - name: Save pnpm package store
        if: ${{ always() && inputs.cache_enabled == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_CACHE_DIR }}
          key: ${{ env.PNPM_CACHE_KEY }}
